<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor PDF</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0c10; color: #e5e7eb;
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", monospace; font-size: 13px; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; padding: 8px 12px; background: #111318; border-bottom: 1px solid #222; }
  .bar a, .bar button { color: #22d3ee; text-decoration: none; background: transparent;
    border: 1px solid rgba(34, 211, 238, 0.35); border-radius: 5px; padding: 3px 9px;
    font: inherit; cursor: pointer; }
  .bar a:hover, .bar button:hover { text-decoration: underline; border-color: #22d3ee; }
  .bar button[hidden] { display: none; }
  #fileInfo { font-size: 0.85rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 100%; }
  .spacer { flex: 1; }
  #counter { font-size: 0.8rem; color: #67e8f9; white-space: nowrap; }
  #log { padding: 6px 12px; }
  #log[hidden] { display: none; }
  .log { margin: 4px 0; padding: 6px 8px; border-radius: 4px; background: #111;
    border-left: 3px solid #22d3ee; word-break: break-all; white-space: pre-wrap; }
  .log.error { border-left-color: #f87171; color: #fca5a5; background: #2a0a0a; }
  .log.ok { border-left-color: #4ade80; color: #86efac; background: #0a2a0a; }
  #pages { padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .page { width: 100%; }
  canvas { background: #fff; border: 1px solid #ddd; max-width: 100%; height: auto; display: block; margin: 4px 0; }
  #end { padding: 10px 12px 22px; color: #64748b; font-size: 0.78rem; }
  #fallback { margin: 12px; padding: 12px; border: 1px solid #f59f00; border-radius: 8px; background: #2a1a0a; }
  #fallback a { color: #fbbf24; }
  .pagenum { font-size: 10px; color: #6b7fa3; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="bar">
  <div id="fileInfo">Cargando…</div>
  <span class="spacer"></span>
  <span id="counter"></span>
  <button id="more" type="button" hidden>Cargar más páginas</button>
  <a id="dl" target="_blank" rel="noopener">Descargar</a>
</div>
<div id="log" hidden></div>
<div id="pages"></div>
<div id="end" hidden>Fin del documento.</div>
<div id="fallback" hidden>
  <strong>No se pudo renderizar el PDF dentro de la página.</strong><br>
  Podés abrirlo o descargarlo directamente: <a id="fbLink" target="_blank" rel="noopener">abrir PDF</a>
</div>
<script src="./build/pdf.js"></script>
<script>
(function () {
  var BLOCK = 4;
  var params = new URLSearchParams(location.search.slice(1));
  var file = params.get("file") || "";
  var pages = document.getElementById("pages");
  var fileInfo = document.getElementById("fileInfo");
  var counter = document.getElementById("counter");
  var moreBtn = document.getElementById("more");
  var dl = document.getElementById("dl");
  var fallback = document.getElementById("fallback");
  var fbLink = document.getElementById("fbLink");
  var endNote = document.getElementById("end");
  var logBox = document.getElementById("log");

  function log(txt, cls) {
    var d = document.createElement("div");
    d.className = "log" + (cls ? " " + cls : "");
    d.textContent = txt;
    logBox.appendChild(d);
    logBox.hidden = false;
    console.log("[viewer] " + txt);
  }
  function err(txt) {
    log(txt, "error");
    fallback.hidden = false;
    fbLink.href = file;
  }

  // El padre ajusta el alto del iframe a este contenido: asi el visor ocupa
  // todo el espacio vertical que necesita y la pagina mantiene un solo scroll.
  function reportHeight() {
    var h = Math.max(
      document.body ? document.body.scrollHeight : 0,
      document.documentElement ? document.documentElement.scrollHeight : 0
    );
    try { parent.postMessage({ type: "nx-pdf-height", h: h }, "*"); } catch (e) {}
  }

  // El padre pide mas paginas cuando su sentinel entra en pantalla.
  var requestMore = function () {};
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.type === "nx-pdf-more") requestMore();
  });

  window.addEventListener("error", function (e) { err("window error: " + (e.message || e)); });
  window.addEventListener("unhandledrejection", function (e) { err("unhandled rejection: " + (e.reason || e)); });

  if (!file) { err("No se especifico archivo (?file=)"); return; }
  var name = file.split("/").pop();
  try { name = decodeURIComponent(name); } catch (e) {}
  fileInfo.textContent = name;
  fileInfo.title = file;
  if (dl) dl.href = file;

  if (typeof pdfjsLib === "undefined") {
    err("pdf.js no se cargo (window.pdfjsLib undefined). Verifica /pdfjs/build/pdf.js");
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "./build/pdf.worker.min.js";

  pdfjsLib.getDocument(file).promise.then(function (pdf) {
    var total = pdf.numPages;
    var rendered = 0;
    var next = 1;
    var busy = false;

    fileInfo.textContent = name + " · " + total + " p\u00e1gs.";
    counter.textContent = "cargando…";
    counter.title = "p\u00e1ginas renderizadas";

    function renderPage(n) {
      var wrapper = document.createElement("div");
      wrapper.className = "page";
      var label = document.createElement("div");
      label.className = "pagenum";
      label.textContent = "P\u00c1GINA " + n + " de " + total;
      var c = document.createElement("canvas");
      wrapper.appendChild(label);
      wrapper.appendChild(c);
      pages.appendChild(wrapper);
      return pdf.getPage(n).then(function (page) {
        var vp = page.getViewport({ scale: 1.15 });
        c.width = vp.width;
        c.height = vp.height;
        c.style.maxWidth = "100%";
        return page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }).then(function () {
        rendered++;
        counter.textContent = rendered + " de " + total + " cargadas";
        reportHeight();
      }).catch(function (e) {
        err("Render p\u00e1gina " + n + ": " + (e && e.message ? e.message : e));
      });
    }

    function updateControls() {
      var pending = next <= total;
      var lote = Math.min(BLOCK, total - rendered);
      moreBtn.hidden = !pending;
      moreBtn.textContent = pending
        ? (lote === 1 ? "Cargar 1 p\u00e1gina m\u00e1s" : "Cargar " + lote + " p\u00e1ginas m\u00e1s")
        : "Cargar m\u00e1s p\u00e1ginas";
      endNote.hidden = pending;
    }

    function renderBlock() {
      if (busy || next > total) { updateControls(); reportHeight(); return Promise.resolve(); }
      busy = true;
      var jobs = [];
      while (jobs.length < BLOCK && next <= total) { jobs.push(renderPage(next)); next++; }
      return Promise.all(jobs).then(function () {
        busy = false;
        updateControls();
        reportHeight();
      });
    }

    moreBtn.addEventListener("click", function () { renderBlock(); });

    requestMore = function () { renderBlock(); };

    // El alto del canvas depende del ancho (max-width:100%), no del alto del
    // iframe: si el iframe cambia de ancho hay que volver a reportar.
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(function () { reportHeight(); }).observe(pages);
    }

    updateControls();
    renderBlock();
  }).catch(function (e) {
    err("getDocument: " + (e && e.message ? e.message : e));
  });
})();
</script>
</body>
</html>
