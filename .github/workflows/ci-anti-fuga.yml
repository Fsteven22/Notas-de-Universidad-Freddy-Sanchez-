name: CI anti-fuga de copyright

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  anti-fuga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar que ningún asset de _no-publicar.txt llegue a site/public/
        run: |
          python - <<'PY'
          import os, re, sys

          negro_path = "Universidad/_no-publicar.txt"
          if not os.path.exists(negro_path):
              print(f"No existe {negro_path}, se salta el chequeo")
              sys.exit(0)

          negro = []
          with open(negro_path, encoding="utf-8") as f:
              for linea in f:
                  linea = linea.strip()
                  if not linea or linea.startswith("#"):
                      continue
                  negro.append(linea)

          def pat_a_regex(p):
              p = re.escape(p)
              p = p.replace(r"\*", ".*").replace(r"\?", ".")
              return p

          regexs = [re.compile(pat_a_regex(p), re.IGNORECASE) for p in negro]

          encontrados = []
          public_dir = "site/public"
          if os.path.isdir(public_dir):
              for root, dirs, files in os.walk(public_dir):
                  for fname in files:
                      ruta = os.path.join(root, fname)
                      rel = os.path.relpath(ruta, public_dir)
                      for rx in regexs:
                          if rx.search(rel) or rx.search(fname):
                              encontrados.append(rel)
                              break

          if encontrados:
              print("FUGA DE COPYRIGHT detectada en site/public/:")
              for e in sorted(encontrados):
                  print("  -", e)
              sys.exit(1)

          print("OK: ningún asset de _no-publicar.txt en site/public/")
          PY
