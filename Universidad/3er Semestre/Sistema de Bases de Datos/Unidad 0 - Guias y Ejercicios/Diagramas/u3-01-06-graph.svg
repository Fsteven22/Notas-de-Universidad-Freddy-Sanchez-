<svg width="700" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b5e20"/>
    </marker>
  </defs>
  <!-- Conjunto A: AEROLINEA -->
  <ellipse cx="250" cy="140" rx="130" ry="90" fill="#e3f2fd" stroke="#01579b" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#01579b">AEROLINEA</text>
  <text x="250" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">{Avianca, Latam, Copa}</text>
  
  <!-- Conjunto B: VUELO (con HOY) -->
  <ellipse cx="450" cy="140" rx="130" ry="90" fill="#e3f2fd" stroke="#01579b" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#01579b">VUELO</text>
  <text x="450" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">σ hora_salida=HOY</text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">{Avianca, Latam}</text>
  
  <!-- Diferencia A − B (solo A, no B) -->
  <ellipse cx="250" cy="140" rx="130" ry="90" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2"/>
  <text x="250" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#b71c1c">A − B = {Copa}</text>
  
  <!-- Operador − -->
  <rect x="330" y="30" width="40" height="40" rx="8" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2"/>
  <text x="350" y="60" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#b71c1c">−</text>
  
  <path d="M 300 100 L 330 100" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 370 100 L 400 100" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Leyenda -->
  <rect x="50" y="210" width="600" height="40" rx="8" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="350" y="232" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Copa está en AEROLINEA pero no en VUELO de hoy → diferencia la incluye</text>
</svg>